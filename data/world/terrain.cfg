# Overworld terrain (design/terrain/overworld_terrain.md). Every number here
# is tunable; restart to apply. Format: DATA_FORMAT.md ("terrain.cfg").
#
# Noise fields: [noise <name>] with scale (blocks per feature), octaves,
# persistence, ridged (0/1), salt (keeps fields independent).
# Splines: [spline <name>] with point = input, output (piecewise linear,
# inputs ascending, clamped at both ends). Noise values are within -1..1
# but mostly within -0.5..0.5 (fractal sums), so the splines focus there.

sea_level           = 96
land_start          = -0.12     # continentalness where land begins
land_ramp           = 0.25      # ... and how quickly mountains are allowed
giant_height        = 650       # giant ridgelines: height of a full ridge
jag_height          = 170       # extra spires on giant ridges
detail_height       = 2         # small bumps everywhere
river_width         = 0.022     # river core (in |river noise|)
river_widen         = 5         # valley width multiplier in lowlands
river_bed           = 93        # riverbed height (sea level - 3)
gorge_max           = 450       # rivers do not cut terrain higher than this
overhang_amplitude  = 26        # blocks of overhang in mountains
overhang_start      = 170       # overhangs fade in above this height
max_height          = 1010
snow_line           = 300
snow_line_variation = 20
snow_cap_above      = 200       # everything this far above the snow line is snow
beach_low           = 94        # top-block heights that count as shore
beach_high          = 99
steep_slope         = 4         # height step to a neighbour: bare stone
scree_slope         = 3         # moderate slope: gravel (shore, or high up)
scree_min_y         = 180
deep_stone_y        = 0         # deep stone below about this height

top_block           = grass_block
filler_block        = dirt
stone_block         = stone
deep_block          = deep_stone
bedrock_block       = bedrock
beach_block         = sand
gravel_block        = gravel
snow_block          = snow
water_block         = water
seabed_clay_block   = clay

# --- noise fields ----------------------------------------------------------
[noise continentalness]
scale = 2600
octaves = 5
persistence = 0.5
salt = 11

[noise erosion]
scale = 1100
octaves = 4
persistence = 0.5
salt = 23

[noise peaks]
scale = 520
octaves = 5
persistence = 0.5
salt = 37

[noise high]
scale = 1500
octaves = 3
persistence = 0.5
salt = 41

[noise giant]
scale = 4200
octaves = 3
persistence = 0.45
salt = 53

[noise ridges]
scale = 700
octaves = 4
persistence = 0.45
ridged = 1
salt = 67

[noise jag]
scale = 70
octaves = 4
persistence = 0.55
ridged = 1
salt = 71

[noise rolling]
scale = 170
octaves = 3
persistence = 0.5
salt = 83

[noise river]
scale = 1300
octaves = 3
persistence = 0.4
salt = 97

[noise detail]
scale = 24
octaves = 2
persistence = 0.5
salt = 101

[noise overhang]                # 3D
scale = 44
octaves = 2
persistence = 0.5
salt = 113

# --- splines -----------------------------------------------------------------
# continentalness -> base height: deep ocean, ocean, coast, lowland, inland
[spline base_height]
point = -1.00, 48
point = -0.55, 58
point = -0.30, 74
point = -0.14, 90
point = -0.05, 97
point = 0.05, 101
point = 0.30, 108
point = 1.00, 122

# erosion -> how mountainous (low erosion = rugged)
[spline mountain_factor]
point = -0.50, 1.00
point = -0.15, 0.90
point = 0.00, 0.60
point = 0.12, 0.30
point = 0.30, 0.08
point = 0.45, 0.00

# peaks noise -> hill / mountain height (scaled by the mountain factor)
[spline peaks_height]
point = -0.45, 0
point = -0.15, 10
point = 0.00, 30
point = 0.10, 80
point = 0.22, 160
point = 0.34, 240
point = 0.50, 280

# high-mountain regions multiply hills by 1 + this
[spline high_factor]
point = 0.05, 0.0
point = 0.18, 0.6
point = 0.30, 1.1
point = 0.45, 1.3

# giant-range mask (0 = none .. 1 = full range): rare, large regions
[spline giant_mask]
point = 0.30, 0.0
point = 0.38, 0.6
point = 0.45, 1.0

# rolling lowland hills (added on land everywhere)
[spline rolling_height]
point = -0.45, -6
point = -0.15, -2
point = 0.15, 5
point = 0.35, 12
point = 0.50, 16