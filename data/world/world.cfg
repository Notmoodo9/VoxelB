# World settings (until world creation in milestone 17). Format: DATA_FORMAT.md.
# seed: any number; the same seed always makes the same world.
# generator: terrain (the real world) or flat_test (debug block gallery).
# Command line: --seed <n> overrides the seed, --flat uses flat_test.
seed      = 20261009
generator = terrain

# Day and night: minutes per day, and the hour the game starts at (0..24).
# Command line: --time <hour> overrides start_time.
day_length = 20
start_time = 8
