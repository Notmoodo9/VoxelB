# Flat test world (Milestones 5-7). DEBUG LAYOUT, not game content: real
# terrain is designed in milestone 8. The world is infinite; how far it is
# shown is render_distance in data/config/graphics.cfg. Blocks come from
# data/blocks/*.blocks. Format: DATA_FORMAT.md.

# --- layers, bottom up:  layer = block, top_y  (filled up to top_y) ----------
layer = bedrock,     -252
layer = deep_stone,  0
layer = stone,       95
layer = dirt,        98
layer = grass_block, 99

# --- block gallery: every registered block as a cube on a grid --------------
# (in front of the start position; rows run towards -Z, in block-id order)
gallery         = 1
gallery_origin  = -40, 100, 240     # x, bottom y, z of the first cube
gallery_columns = 16
gallery_size    = 3                 # cube edge in blocks
gallery_gap     = 2

# --- debug structures near the origin: banded hills and pillars that cross
# section borders (mesher stress test) ----------------------------------------
test_structures  = 1
structure_blocks = green_terracotta, lime_terracotta, yellow_terracotta, orange_terracotta, magenta_terracotta
pillar_block     = white_wool
