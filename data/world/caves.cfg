# Caves, ravines, shafts, aquifers, lava, cave decoration
# (design/terrain/underground.md). Same record format as terrain.cfg.

cave_bottom_y          = -250    # nothing is carved at or below this height
cave_crust             = 7       # caves stay this far below the surface...
entrance_threshold     = 0.32    # ...except where the entrance field is higher
tunnel_width           = 0.075   # tunnels: |(a, b)| below this (noise units)
passage_width          = 0.028   # narrow passages (Y -200 .. 80)
pillar_width           = 0.36    # pillar field above this: natural pillar
sky_cavern_threshold   = 0.42    # sky field above this: a sky-open cavern
sky_cavern_depth       = 140     # open bowl from the surface, deepest at the centre
sky_cavern_openness    = 0.35    # how much the cavern threshold drops there
ravine_threshold       = 0.33    # ravine mask above this: ravines here
ravine_width           = 0.03
ravine_depth_min       = 30
ravine_depth_max       = 80
shaft_spacing          = 160     # one possible shaft per 160 x 160 cell...
shaft_chance           = 0.3     # ...present in this share of cells
shaft_radius_min       = 1.0     # 2-4 blocks wide
shaft_radius_max       = 1.8
shaft_depth_min        = 30
shaft_depth_max        = 120
aquifer_size           = 64      # blocks per aquifer region (x and z)
lake_chance            = 0.4     # share of regions with an underground lake
lake_min_y             = -90
lake_max_y             = 70
lava_region_top_y      = -90     # lava only below this
lava_min_y             = -230    # lava level range of a region
lava_max_y             = -120
dripstone_chance       = 0.08    # per cave ceiling / floor block
floor_patch_threshold  = 0.30    # |detail| above this: gravel, clay or mud floor
ore_wall_bonus         = 0.3     # extra ore attempts that must touch a cave

lava_block             = lava
dripstone_block        = pointed_dripstone
mud_block              = mud

# cavern threshold by height: lower = bigger caverns (cavern noise is mostly
# within -0.5 .. 0.5)
[spline cavern_threshold]
point = -256, 0.90
point = -240, 0.36
point = -150, 0.24
point = -60, 0.30
point = 0, 0.36
point = 60, 0.46
point = 120, 0.60

[noise cheese]          # 3D caverns
scale = 90
octaves = 2
persistence = 0.5
salt = 201

[noise tunnel_a]        # 3D
scale = 70
octaves = 1
persistence = 0.4
salt = 211

[noise tunnel_b]        # 3D
scale = 70
octaves = 1
persistence = 0.4
salt = 223

[noise passage_a]       # 3D
scale = 45
octaves = 1
salt = 227

[noise passage_b]       # 3D
scale = 45
octaves = 1
salt = 229

[noise pillar]          # 2D
scale = 14
octaves = 2
persistence = 0.5
salt = 233

[noise entrance]        # 2D
scale = 120
octaves = 2
persistence = 0.5
salt = 239

[noise sky_cavern]      # 2D
scale = 700
octaves = 2
persistence = 0.4
salt = 241

[noise ravine]          # 2D lines
scale = 260
octaves = 2
persistence = 0.35
salt = 251

[noise ravine_mask]     # 2D
scale = 500
octaves = 2
persistence = 0.4
salt = 257
