# Ores (design/terrain/underground.md). One [ore <name>] record per ore.
#   block / deep_block   block in stone / in deep stone (deep_block may be
#                        omitted: the same block is used)
#   min_y, max_y         height range; peak_y: most common height
#                        (omit for an even spread)
#   size_min, size_max   blocks per cluster (random walk)
#   per_section          clusters per 32x32x32 section inside the range
#   mountain_only = 1    only inside mountains (y >= 180, below the surface)
#   mountain_bonus       extra share of clusters inside mountains
#   deep_only = 1        only in deep stone
#   vein_chance          chance per section of one large vein
#   vein_size            blocks in a large vein
# ore_wall_bonus (caves.cfg) adds attempts that must touch a cave.

[ore coal]
block = coal_ore
min_y = 0
max_y = 400
peak_y = 150
size_min = 6
size_max = 14
per_section = 14
mountain_bonus = 0.5

