# The player's body and movement (milestone 16). Format: DATA_FORMAT.md.
# Speeds are in blocks per second; gravity is in data/world/world.cfg.
# Every value can be tuned; restart the game to apply.

# body: a box width x height; the eyes are this high above the feet
width             = 0.6
height            = 1.8
eye_height        = 1.62
sneak_eye_height  = 1.27

# walking: move_up jumps, sprint (forward only) runs, move_down sneaks
walk_speed        = 4.317
sprint_speed      = 5.612
sneak_speed       = 1.31
jump_velocity     = 8.95        # upward speed of a jump (about 1.25 blocks high)
ground_accel      = 0.5         # share of the speed gap closed per tick on the ground
air_accel         = 0.08        # ... in the air
terminal_speed    = 78          # fastest fall
step_height       = 0.6         # walks up slabs and stairs without jumping

# swimming (water; lava slows it further)
swim_speed        = 2.2
swim_sprint_speed = 4.0
swim_up_speed     = 3.5         # move_up swims up, move_down dives
sink_speed        = 1.5
water_accel       = 0.2
lava_slowdown     = 0.5

# ladders and vines
climb_speed       = 2.35
climb_down_speed  = 3.0         # slowest slide down (move_down holds on)

# Creative flight: press move_up twice quickly to start / stop flying
fly_speed             = 12
fly_sprint_multiplier = 5
fly_vertical          = 0.6     # share of fly_speed for move_up / move_down
fly_accel             = 0.35

# breaking and placing blocks: how far away (blocks, from the eyes)
reach             = 5

# --flytest (streaming test): flies north through everything at this speed
flytest_speed     = 60
