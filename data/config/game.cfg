# VoxelB game settings (format: DATA_FORMAT.md). The settings screen
# (Settings > Game) writes this file; editing it by hand works too.

# Field of view: vertical, in degrees (50..110).
fov = 70

# Save the world every this many minutes (0 = only when leaving it).
autosave_minutes = 5

# 1 = show the HUD (crosshair, held block); 0 = a clean screen.
show_hud = 1

# 1 = the recipe book page is open next to crafting grids (the book icon or
# the recipe_book key toggles it; the game remembers the last choice).
recipe_book = 1
