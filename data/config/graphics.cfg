# VoxelB graphics settings (format: DATA_FORMAT.md). Edit and restart.

# Full-detail view distance in chunks (32 blocks each), 2..48. Chunks are
# generated two rings further out (lighting needs all 8 neighbours) and
# dropped four rings beyond.
render_distance = 16

# Distant terrain (level-of-detail tiles) out to this many chunks, 0..256.
# 0 (or not beyond render_distance) turns it off. 64 is the default; 128-256
# for strong PCs.
lod_distance = 64

# Lighting (milestone 13): 1 = smooth light across faces (0 = flat per
# face), 1 = ambient occlusion (darker inner corners).
smooth_lighting = 1
ambient_occlusion = 1

# Post-processing and atmosphere (milestone 14): 1 = bloom (glowing blocks
# and the sun bleed light), 1 = height fog (mist in low ground).
bloom = 1
height_fog = 1

# Shadows from the sun and moon (milestone 14): 1 = on; the map size
# (512, 1024, 2048, 4096: sharper but slower) and how far they reach in
# blocks (32..512).
shadows = 1
shadow_resolution = 2048
shadow_distance = 160

# 1 = the drifting cloud layer (its height and cover are in
# data/world/world.cfg).
clouds = 1

# The held light (toggle_held_light in controls.cfg): colour as r, g, b
# light levels 0..15. A stand-in for held torches until items (M18).
held_light = 14, 11, 6

# 1 = draw leaves as solid cubes (faster on weak GPUs), 0 = see-through.
opaque_leaves = 0

# 1 = cull the draws on the GPU (compute shader, exact frustum test);
# 0 = the CPU's visibility walk only.
gpu_culling = 1

# 1 = also skip sections hidden behind last frame's depth (Hi-Z occlusion
# culling; needs gpu_culling).
occlusion_culling = 1
