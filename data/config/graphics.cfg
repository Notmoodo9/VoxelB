# VoxelB graphics settings (format: DATA_FORMAT.md). Edit and restart.

# Full-detail view distance in chunks (32 blocks each), 2..48. Chunks are
# generated one ring further out and dropped three rings beyond.
render_distance = 16

# 1 = draw leaves as solid cubes (faster on weak GPUs), 0 = see-through.
opaque_leaves = 0
