# VoxelB controls. Edit and restart the game to apply.
# Format (see DATA_FORMAT.md):  name = value      '#' starts a comment.
# Actions take up to two keys separated by ','.
# Key names: A-Z, 0-9, F1-F12, Space, Escape, Enter, Tab, Backspace, Shift,
#   Ctrl, Alt, CapsLock, Up, Down, Left, Right, Insert, Delete, Home, End,
#   PageUp, PageDown, Grave, Minus, Equals, Comma, Period, Slash,
#   Mouse1 (left), Mouse2 (right), Mouse3 (middle).

# --- movement (milestone 16) --------------------------------------------------
# move_up: jump, swim up, climb, fly up; press it twice quickly to start or
# stop flying (Creative). move_down: sneak (never walks off edges), dive,
# fly down. Speeds are in data/entities/player.cfg.
move_forward          = W, Up
move_back             = S, Down
move_left             = A, Left
move_right            = D, Right
move_up               = Space
move_down             = Shift
sprint                = Ctrl

# --- blocks (milestone 16) -------------------------------------------------------
break_block           = Mouse1      # hold to keep breaking
place_block           = Mouse2      # places the held block (hold to keep placing)
pick_block            = Mouse3      # brings the targeted block's item to hand
inventory             = E           # the inventory (Creative: every block and item)
hotbar_1              = 1           # hotbar slots (the mouse wheel steps through them)
hotbar_2              = 2
hotbar_3              = 3
hotbar_4              = 4
hotbar_5              = 5
hotbar_6              = 6
hotbar_7              = 7
hotbar_8              = 8
hotbar_9              = 9
recipe_book           = R           # the recipe book page next to crafting grids
swap_hands            = F           # the main and the off hand trade items

# --- debug / system ---------------------------------------------------------
toggle_debug_overlay  = F3
toggle_vsync          = F8
reload_shaders        = F5
menu                  = Escape      # releases the mouse; pressed again: quit
toggle_held_light     = L           # a torch in hand (milestone 13 test light)
time_forward          = T           # hold: time of day runs fast

# --- settings -----------------------------------------------------------------
mouse_sensitivity     = 0.12        # degrees per mouse count
invert_mouse_y        = 0           # 1 = invert
