# Melee (milestone 21 part 1, design/combat/combat.md; DATA_FORMAT.md
# "combat.cfg"). Damage in health points (the player has 20). Weapons'
# own numbers are in the item files (`damage`, `swing`, `knockback`,
# `reach`); these are the rules around them.

# the bare hand (and any item without `damage` / `swing`)
hand_damage = 1
hand_swing = 0.25

# a hit before the swing meter is full: damage x (min_factor +
# (1 - min_factor) x meter^2); knock-back x (0.4 + 0.6 x meter)
min_factor = 0.2

# a full swing (meter >= crit_meter) while falling: damage x crit_factor
crit_factor = 1.5
crit_meter = 0.9

# a full sword swing on the ground also hits the animals within
# sweep_radius blocks of the target for sweep_damage + sweep_fraction x
# the damage (half the knock-back)
sweep_damage = 1
sweep_fraction = 0.3
sweep_radius = 1

# blocks of reach beyond the player's (to the animal's centre)
reach_extra = 1.5

# hunger per hit (exhaustion, like sprinting 1 block = 0.1)
exhaust_attack = 0.1

# durability a hit takes from a weapon / from another tool
weapon_wear = 1
tool_wear = 2

# the feel (client): the hit pause in seconds (a hit, a critical hit, an
# axe or mace hit) and the camera shake's strength (0 = none)
hit_pause = 0.05
crit_pause = 0.08
heavy_pause = 0.1
shake = 0.6

# ---- armor (milestone 21 part 2) ----------------------------------------
# damage from rams, fire, lava and cactus x (1 - protection_per_point x
# min(points, protection_cap)); every piece worn wears 1 per such hit.
# Pieces' points are their `protection` (data/items/30_armor.items).
protection_per_point = 0.04
protection_cap = 20

# mobility, by the share of the body in each weight (helmet 15 %,
# chestplate 40 %, leggings 30 %, boots 15 %): walking speed x (1 -
# medium_slow x medium share - heavy_slow x heavy share); hunger from
# moving x (1 + heavy_hunger x heavy share)
medium_slow = 0.05
heavy_slow = 0.12
heavy_hunger = 0.25

# a shield in the off hand: hold place_block (with nothing that eats or
# places in the main hand) for shield_raise seconds; it then takes every
# hit from within shield_arc degrees in front (no damage, shield_push x
# the knock-back) and wears by the damage; the player walks at sneak speed
shield_raise = 0.25
shield_arc = 90
shield_push = 0.3

# the dodge roll (double-tap move_left / move_right / move_back, or the
# dodge key): roll_distance blocks in roll_time seconds, roll_safe seconds
# without damage, roll_cooldown seconds before the next, exhaust_roll
# hunger. Medium (and heavy) armor shortens it toward
# roll_distance_medium; from roll_heavy of the body in heavy armor there
# is no roll.
roll_distance = 3
roll_distance_medium = 2
roll_time = 0.35
roll_safe = 0.2
roll_cooldown = 1.5
exhaust_roll = 0.3
roll_heavy = 0.5
