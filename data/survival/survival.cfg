# Survival (milestone 20, design/survival/survival.md, DATA_FORMAT.md
# "Survival"). Health and hunger points: 2 = one heart / one food icon.
# Times in seconds. Food values are on the items (`food = hunger,
# saturation`, data/items).

health          = 20
hunger          = 20
start_saturation = 5
# every `exhaustion_per_point` of exhaustion takes one saturation point
# (or one hunger point once saturation is gone)
exhaustion_per_point = 4.0
exhaust_sprint  = 0.1       # per block sprinted
exhaust_swim    = 0.01      # per block swum
exhaust_jump    = 0.05
exhaust_sprint_jump = 0.2
exhaust_mine    = 0.005     # per block broken
exhaust_damage  = 0.1       # per hit taken
exhaust_heal    = 6.0       # per health point regenerated

regen_fast      = 0.5       # full hunger with saturation left: 1 HP every ...
regen_slow      = 4.0       # hunger >= regen_hunger: 1 HP every ...
regen_hunger    = 18
starve_every    = 4.0       # no hunger: 1 HP every ...
eat_time        = 1.6       # default time to eat
eat_speed       = 0.35      # walking speed while eating (x)
poison_time     = 30
poison_exhaust  = 0.5       # per second while poisoned

# damage
fall_safe       = 3         # blocks fallen without harm; 1 HP each block more
air             = 15        # seconds under water
drown_damage    = 2         # HP each second without air
lava_damage     = 4         # HP every half second
burn_time       = 8         # seconds on fire after leaving lava
burn_damage     = 1         # HP each second on fire
suffocate_damage = 1        # HP every half second
cactus_damage   = 1         # HP every half second
void_y          = -320
void_damage     = 4         # HP every half second
hurt_time       = 0.5       # no new damage for this long after a hit

# by difficulty: damage taken x, hunger drain x, natural regeneration
# (normal | fast | full_only | none), its time for fast / full_only, and
# where starvation stops (health points; 0 = it kills)
[difficulty peaceful]
damage   = 0.5
hunger   = 0
regen    = fast
regen_every = 1.0
starve_floor = 10

[difficulty normal]
damage   = 1
hunger   = 1
regen    = normal
starve_floor = 1

[difficulty hard]
damage   = 1.5
hunger   = 1.25
regen    = normal
starve_floor = 0

[difficulty extreme]
damage   = 1.75
hunger   = 1.5
regen    = full_only
regen_every = 6.0
starve_floor = 0

[difficulty ultra]
damage   = 2
hunger   = 1.75
regen    = none
starve_floor = 0
