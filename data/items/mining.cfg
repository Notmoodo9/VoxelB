# How blocks are mined and what they drop (milestone 18, format:
# DATA_FORMAT.md "mining.cfg"; design/items/items_inventory.md).
#
# [material <name>]: hardness (seconds-ish; 0 = instant, below 0 = never),
# the tool that mines it fast (pickaxe, axe, shovel, hoe), and the tier that
# tool needs for the block to drop anything (hand = no need). A block takes
# the first material whose `shapes` or `blocks` (name patterns, '*' =
# anything) match it. Unmatched blocks: hardness 1, any tool, no tier.
# Mining time = hardness x 1.5 (x 5 when it won't drop), divided by the
# speed of the right tool: stone by hand ~7.5 s and no drop, a wood pick ~1.1 s.

[material unbreakable]
hardness = -1
blocks = bedrock, water, lava
shapes = fluid

[material plant]
hardness = 0
shapes = plant, tall_plant
blocks = lily_pad, flowering_lily_pad, vine, hanging_vine, hanging_roots, spanish_moss, river_weed, river_grass, *_crystal_sprout

# ---- ores: the tier ladder (design: "step by step") ----
[material star_crystal_ore]
hardness = 4.5
tool = pickaxe
tier = adamantite
blocks = star_crystal_ore

[material adamantite_ore]
hardness = 4.5
tool = pickaxe
tier = mythril
blocks = adamantite_ore

[material mythril_ore]
hardness = 4
tool = pickaxe
tier = diamond
blocks = mythril_ore

[material gem_ore]
hardness = 3
tool = pickaxe
tier = iron
blocks = diamond_ore, emerald_ore

[material precious_ore]
hardness = 3
tool = pickaxe
tier = copper
blocks = silver_ore, deep_silver_ore, gold_ore, deep_gold_ore

[material base_ore]
hardness = 3
tool = pickaxe
tier = stone
blocks = copper_ore, deep_copper_ore, iron_ore, deep_iron_ore

[material coal_ore]
hardness = 3
tool = pickaxe
tier = wood
blocks = coal_ore

# ---- rock ----
[material deep_stone]
hardness = 3
tool = pickaxe
tier = wood
blocks = deep_stone, *_veined_stone

[material crystal]
hardness = 1.5
tool = pickaxe
tier = wood
blocks = blue_crystal, purple_crystal, green_crystal, pink_crystal, amber_crystal

[material sandstone]
hardness = 0.8
tool = pickaxe
tier = wood
blocks = sandstone*

[material cobble]
hardness = 2
tool = pickaxe
tier = wood
blocks = cobblestone, mossy_cobblestone, bricks, bone_block

[material terracotta]
hardness = 1.25
tool = pickaxe
tier = wood
blocks = *_terracotta

[material stone]
hardness = 1.5
tool = pickaxe
tier = wood
blocks = stone, smooth_stone, stone_bricks, dripstone_block, pointed_dripstone, salt

[material ice]
hardness = 0.5
tool = pickaxe
blocks = ice, packed_ice, blue_ice

[material glass]
hardness = 0.3
blocks = glass, tinted_glass, *_stained_glass, *lamp, glowstone, *_glow_pool

# ---- wood and plants that grow big ----
[material wood]
hardness = 2
tool = axe
blocks = *_log, *_bark, stripped_*, *_planks, *_stem, dead_wood, *_slab, *_stairs, *_fence, *_fence_gate, *_wall

[material wood_fittings]
hardness = 1.5
tool = axe
blocks = workbench, chest, *_bookshelf, *_door, *_trapdoor, *_sign, melon, cocoa_pod, bamboo

[material wood_thin]
hardness = 0.5
tool = axe
blocks = *_ladder, *_pressure_plate, *_cap, *_gills, shelf_fungus

[material leaves]
hardness = 0.2
tool = hoe
blocks = *_leaves

[material cactus]
hardness = 0.4
blocks = cactus

# ---- soil ----
[material soil]
hardness = 0.5
tool = shovel
blocks = dirt, coarse_dirt, sand, red_sand, mud, forest_floor, spruce_needle_floor, snow

[material soil_firm]
hardness = 0.6
tool = shovel
blocks = grass_block, gravel, clay, mycelium, termite_mound

[material moss]
hardness = 0.1
tool = hoe
blocks = moss_block, glow_moss

[material wool]
hardness = 0.8
blocks = *_wool

# What blocks drop instead of themselves: <block pattern> = <item> [count],
# or none. The first matching line counts.
[drops]
grass_block = dirt
forest_floor = dirt
spruce_needle_floor = dirt
mycelium = dirt
stone = cobblestone
coal_ore = coal
diamond_ore = diamond
emerald_ore = emerald
star_crystal_ore = star_crystal
*_leaves = none
glass = none
*_stained_glass = none
ice = none
packed_ice = none
blue_ice = none
short_grass = none
tall_grass = none
fern = none
dead_bush = none
*_crystal_sprout = none
