name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # needed to publish the "Latest build" release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Put LLVM (lld-link) on PATH
        shell: pwsh
        run: |
          if (-not (Get-Command lld-link -ErrorAction SilentlyContinue)) {
            "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Tool versions
        shell: cmd
        run: |
          nasm -v
          lld-link --version

      - name: Build debug
        shell: cmd
        run: call build.bat debug clean

      - name: Build release
        shell: cmd
        run: call build.bat release clean

      - name: Smoke test (debug)
        shell: pwsh
        run: ./tools/smoke_test.ps1 -Config debug

      - name: Smoke test (release)
        shell: pwsh
        run: ./tools/smoke_test.ps1 -Config release

      - name: Package
        id: package
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $name = "voxelb-$sha"
          $stage = "dist\VoxelB"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build\release\voxelb.exe $stage
          foreach ($d in 'data', 'shaders', 'assets') {
            if (Test-Path $d) { Copy-Item $d $stage -Recurse }
            else { New-Item -ItemType Directory -Force "$stage\$d" | Out-Null }
          }
          Compress-Archive -Path $stage -DestinationPath "dist\$name.zip" -Force
          Copy-Item "dist\$name.zip" "dist\voxelb-windows.zip"
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/VoxelB/
          if-no-files-found: error

      - name: Publish "Latest build" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest `
            "dist\${{ steps.package.outputs.name }}.zip" `
            "dist\voxelb-windows.zip" `
            --title "Latest build" `
            --notes "Automatic Windows build of main at $sha. Download voxelb-windows.zip, unzip, run VoxelB\voxelb.exe." `
            --target "${{ github.sha }}" `
            --latest
