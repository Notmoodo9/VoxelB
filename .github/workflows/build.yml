name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # needed to publish the "Latest build" release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # tags and history for the release notes

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Put LLVM (lld-link) on PATH
        shell: pwsh
        run: |
          if (-not (Get-Command lld-link -ErrorAction SilentlyContinue)) {
            "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Tool versions
        shell: cmd
        run: |
          nasm -v
          lld-link --version

      - name: Build debug
        shell: cmd
        run: call build.bat debug clean

      - name: Build release
        shell: cmd
        run: call build.bat release clean

      # The runner has no GPU, so its OpenGL is GDI's 1.1. For the smoke test
      # only, drop Mesa's llvmpipe (software GL 4.5 core) next to the exe.
      # These DLLs are never packaged.
      - name: Install Mesa llvmpipe for the smoke test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R pal1000/mesa-dist-win --pattern "mesa3d-*-release-msvc.7z" -D mesa
          $archive = (Get-ChildItem mesa\*.7z | Select-Object -First 1).FullName
          Write-Host "Mesa archive: $archive"
          7z x $archive -omesa\x -y | Out-Null
          foreach ($c in 'debug', 'release') { Copy-Item mesa\x\x64\*.dll "build\$c\" }
          Get-ChildItem build\release\*.dll | ForEach-Object { Write-Host $_.Name }

      - name: Smoke test (debug)
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: ./tools/smoke_test.ps1 -Config debug

      - name: Smoke test (release)
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: ./tools/smoke_test.ps1 -Config release

      - name: Package
        id: package
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $name = "voxelb-$sha"
          $stage = "dist\VoxelB"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build\release\voxelb.exe $stage
          foreach ($d in 'data', 'shaders', 'assets') {
            if (Test-Path $d) { Copy-Item $d $stage -Recurse }
            else { New-Item -ItemType Directory -Force "$stage\$d" | Out-Null }
          }
          Compress-Archive -Path $stage -DestinationPath "dist\$name.zip" -Force
          Copy-Item "dist\$name.zip" "dist\voxelb-windows.zip"
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/VoxelB/
          if-no-files-found: error

      # Publishes from the repository's default branch (currently
      # claude/keen-lovelace-3ysglx; follows automatically if that changes).
      - name: Publish "Latest build" release
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          gh release delete latest --yes --cleanup-tag 2>$null
          $ver = ""
          if (Test-Path data\version.cfg) {
            $m = (Get-Content data\version.cfg | Select-String '^\s*version\s*=\s*(.+)$')
            if ($m) { $ver = " (v" + $m.Matches[0].Groups[1].Value.Trim() + ")" }
          }
          gh release create latest `
            "dist\${{ steps.package.outputs.name }}.zip" `
            "dist\voxelb-windows.zip" `
            --title "Latest build$ver" `
            --notes "Automatic Windows build of ${{ github.ref_name }} at $sha. Download voxelb-windows.zip, unzip, run VoxelB\voxelb.exe." `
            --target "${{ github.sha }}" `
            --latest

      # A permanent, named release per version (data/version.cfg: version
      # and title), e.g. "VoxelB v0.18.1 - Items and inventory", so every
      # version stays downloadable. Made once, by the first push that
      # carries a new version number.
      - name: Publish versioned release
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path data\version.cfg)) { Write-Host "no data/version.cfg"; exit 0 }
          $cfg = Get-Content data\version.cfg
          $ver = (($cfg | Select-String '^\s*version\s*=\s*(.+)$').Matches[0].Groups[1].Value).Trim()
          $title = (($cfg | Select-String '^\s*title\s*=\s*(.+)$').Matches[0].Groups[1].Value).Trim()
          $tag = "v$ver"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { Write-Host "$tag already released"; exit 0 }
          $prev = git describe --tags --match "v*" --abbrev=0 2>$null
          $range = if ($prev) { "$prev..HEAD" } else { "HEAD~10..HEAD" }
          $changes = git log --format="- %s" $range | Where-Object { $_ -notmatch 'PROGRESS: record' }
          $sha = "${{ github.sha }}".Substring(0, 7)
          $notes = "**$title** (commit $sha).`n`nDownload voxelb-$tag-windows.zip, unzip it and run VoxelB\voxelb.exe.`n`nChanges since $(if ($prev) { $prev } else { 'the last builds' }):`n" + ($changes -join "`n")
          Copy-Item "dist\voxelb-windows.zip" "dist\voxelb-$tag-windows.zip"
          gh release create $tag "dist\voxelb-$tag-windows.zip" `
            --title "VoxelB $tag - $title" `
            --notes $notes `
            --target "${{ github.sha }}" `
            --latest=false

      - name: Show game logs
        if: always()
        shell: pwsh
        run: |
          foreach ($c in 'debug', 'release') {
            Write-Host "==== build/$c/voxel.log ===="
            if (Test-Path "build/$c/voxel.log") { Get-Content "build/$c/voxel.log" } else { Write-Host "(none)" }
          }
